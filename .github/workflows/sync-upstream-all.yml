name: Sync upstream branches and tags (strict)

on:
  schedule:
    - cron: '* */3 * * *' # 每3小时触发, 对于一些更新不那么频繁的项目可以设置为每天一次, 低碳一点
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/imsyy/SPlayer.git
          git fetch upstream --prune --tags

      - name: Sync all branches (fail on conflict)
        run: |
          set -e

          for branch in $(git branch -r | grep '^  upstream/' | grep -v 'HEAD' | sed 's|  upstream/||'); do
            echo "🔄 Syncing branch: $branch"

            # fork 中已存在该分支
            if git show-ref --verify --quiet refs/heads/$branch; then
              git checkout $branch

              # 使用 merge；一旦冲突立即失败
              git merge upstream/$branch --no-edit || {
                echo "❌ Merge conflict on branch: $branch"
                exit 1
              }
            else
              # fork 中不存在该分支，直接创建
              git checkout -b $branch upstream/$branch
            fi

            git push origin $branch
          done

      - name: Sync tags
        run: |
          git push origin --tags
